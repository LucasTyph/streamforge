# Full stack on k3d inside the runner (`make up-lite`), then the Playwright smoke test.
name: e2e

on:
  pull_request:
    paths: ['apps/**', 'services/**', 'go/**', 'deploy/**', 'infra/terraform/**', 'Makefile', '.github/workflows/e2e.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: tools (same pinned, checksum-verified installer as local dev)
        run: |
          sudo apt-get update -q && sudo apt-get install -yq ffmpeg libatomic1
          scripts/install-tools.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: make up-lite (k3d + CloudNativePG + images + Helm)
        run: make up-lite
      - run: make status
      - name: playwright
        run: |
          pnpm --filter @streamforge/web exec playwright install --with-deps chromium
          E2E_BASE_URL=http://streamforge.localhost make test-e2e
      - if: failure()
        name: diagnostics
        run: |
          kubectl get pods -A -o wide
          kubectl -n streamforge get events --sort-by=.lastTimestamp | tail -40
          for d in catalog-api web progress-svc probe-worker transcode-worker thumbnail-worker; do
            echo "== $d"; kubectl -n streamforge logs deploy/$d --tail 40 || true
          done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: { name: playwright-report, path: apps/web/playwright-report, retention-days: 7 }
