# Manual promotion: prod gets exactly the image tags currently running in staging.
# Add required reviewers to the `production` environment for an approval gate.
name: promote

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: copy staging tags to prod
        run: |
          cp deploy/gitops/staging/images.yaml deploy/gitops/prod/images.yaml
          git diff --stat
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/gitops/prod/images.yaml
          git diff --cached --quiet && { echo "prod already matches staging"; exit 0; }
          git commit -m "chore(gitops): promote staging to prod (by @${GITHUB_ACTOR}) [skip ci]"
          git push origin HEAD:main
