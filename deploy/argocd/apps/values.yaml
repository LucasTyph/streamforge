repoURL: https://github.com/LucasTyph/streamforge.git # `make gitops-owner OWNER=<github user>`
targetRevision: main

cnpg:
  chartVersion: 0.29.1 # operator 1.30.1, same as `make platform`

# Each environment = two Helm releases in its own namespace, configured by
# deploy/gitops/<name>/{values,images}.yaml.
environments:
  - name: staging
    namespace: streamforge-staging
  - name: prod
    namespace: streamforge-prod
