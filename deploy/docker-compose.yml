# Dev loop: infrastructure + emulators. API and web run on the host (`make dev`).
# Run via the Makefile so ../.env is loaded: docker compose --env-file .env -f deploy/docker-compose.yml ...
name: streamforge

x-aws-env: &aws-env
  AWS_REGION: ${AWS_REGION}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      retries: 20
    mem_limit: 256m

  redis:
    image: redis:8.8.4-alpine3.23
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "48mb"]
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
    mem_limit: 64m

  # S3-compatible object store (ADR-002). Credentials are generated from env at start.
  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"dev","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","Write","List","Tagging"]},{"name":"anonymous","actions":["Read:streamforge-processed"]}]}' \
          "$$AWS_ACCESS_KEY_ID" "$$AWS_SECRET_ACCESS_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json \
          -master.volumeSizeLimitMB=512 -volume.max=0 -ip.bind=0.0.0.0 \
          -s3.concurrentUploadLimitMB=64 -filer.concurrentUploadLimitMB=64 -volume.concurrentUploadLimitMB=64
    environment: *aws-env
    ports: ["8333:8333"]
    volumes: [s3data:/data]
    mem_limit: 768m # observed ~480 MiB idle after M2 tests (docs/results.md)

  # SQS-compatible queue (ADR-002)
  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    ports: ["9324:9324", "9325:9325"]
    volumes:
      - ./helm/streamforge-deps/files/elasticmq.conf:/opt/elasticmq.conf:ro
    mem_limit: 128m

  # Minimal SNS emulator that fans out to ElasticMQ (go/cmd/sns-shim)
  sns-shim:
    build: { context: ../go, args: { CMD: sns-shim } }
    image: streamforge/sns-shim:dev
    environment:
      <<: *aws-env
      AWS_ENDPOINT_URL_SQS: http://elasticmq:9324
      STATE_FILE: /data/state.json
    ports: ["9911:9911"]
    volumes: [snsdata:/data]
    depends_on: [elasticmq]
    mem_limit: 32m

  # Pipeline workers (go/cmd/*). Endpoints point at the emulators inside the compose network.
  probe-worker:
    build: { context: ../go, dockerfile: Dockerfile.ffmpeg, args: { CMD: probe } }
    image: streamforge/probe-worker:dev
    environment: &worker-env
      <<: *aws-env
      AWS_ENDPOINT_URL_S3: http://seaweedfs:8333
      AWS_ENDPOINT_URL_SQS: http://elasticmq:9324
      AWS_ENDPOINT_URL_SNS: http://sns-shim:9911
      REDIS_URL: redis://redis:6379
      JOB_STATUS_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:streamforge-job-status
      VIDEO_PROBED_TOPIC_ARN: arn:aws:sns:us-east-1:000000000000:streamforge-video-probed
      PROBE_QUEUE_URL: http://elasticmq:9324/000000000000/streamforge-probe
    depends_on: [elasticmq, sns-shim, seaweedfs, redis]
    stop_grace_period: 60s
    mem_limit: 128m

  transcode-worker:
    build: { context: ../go, dockerfile: Dockerfile.ffmpeg, args: { CMD: transcode } }
    image: streamforge/transcode-worker:dev
    environment:
      <<: *worker-env
      PROCESSED_BUCKET: streamforge-processed
      TRANSCODE_QUEUE_URL: http://elasticmq:9324/000000000000/streamforge-transcode
    tmpfs: ["/work:size=1g,uid=65532,gid=65532"]
    depends_on: [elasticmq, sns-shim, seaweedfs, redis]
    stop_grace_period: 35s
    cpus: 2
    mem_limit: 1g

  thumbnail-worker:
    build: { context: ../go, dockerfile: Dockerfile.ffmpeg, args: { CMD: thumbnail } }
    image: streamforge/thumbnail-worker:dev
    environment:
      <<: *worker-env
      PROCESSED_BUCKET: streamforge-processed
      THUMBNAIL_QUEUE_URL: http://elasticmq:9324/000000000000/streamforge-thumbnail
    tmpfs: ["/work:size=256m,uid=65532,gid=65532"]
    depends_on: [elasticmq, sns-shim, seaweedfs, redis]
    stop_grace_period: 50s
    cpus: 1
    mem_limit: 384m

  # Live progress over Server-Sent Events (go/cmd/progress)
  progress-svc:
    build: { context: ../go, args: { CMD: progress } }
    image: streamforge/progress-svc:dev
    environment:
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      WEB_ORIGIN: ${WEB_ORIGIN}
      PORT: "4001"
    ports: ["4001:4001"]
    depends_on: [redis]
    stop_grace_period: 25s
    mem_limit: 64m

volumes:
  pgdata:
  s3data:
  snsdata:
