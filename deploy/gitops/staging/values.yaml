# Staging, synced by ArgoCD from `main` (both Helm releases read this file).
# Images come from GHCR; tags live in images.yaml (bumped by CI on every merge).
global:
  registry: ghcr.io/lucastyph # `make gitops-owner OWNER=<github user>`
  observability: { enabled: true, namespace: monitoring, otlpEndpoint: "http://otel-collector.monitoring.svc.cluster.local:4318" }

secrets: { create: false } # created out of band: scripts/gitops-secrets.sh

# app chart
host: staging.streamforge.localhost
s3PublicUrl: http://s3.staging.streamforge.localhost
catalogApi: { hpa: { minReplicas: 1, maxReplicas: 2, cpu: 70 }, pdb: { minAvailable: null, maxUnavailable: 1 } }
web: { replicas: 1, pdb: { minAvailable: null, maxUnavailable: 1 } }

# deps chart
s3: { publicHost: s3.staging.streamforge.localhost }
webOrigins: ["http://staging.streamforge.localhost"]
postgres: { storage: 1Gi }
seaweedfs: { persistence: { size: 2Gi, mountPath: /data } }
