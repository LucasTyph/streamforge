include classpath("application.conf")

node-address {
  protocol = http
  host = localhost
  port = 9324
  context-path = ""
}
generate-node-address = false

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

aws {
  region = us-east-1
  accountId = 000000000000
}

# Queues are declared here, not in Terraform: the AWS provider waits for
# attributes ElasticMQ doesn't store (MessageRetentionPeriod, MaximumMessageSize,
# SqsManagedSseEnabled) and times out. Must mirror local.queues in
# infra/terraform/modules/pipeline/main.tf (checked by scripts/smoke-messaging.sh). See ADR-002.
# Messages are in-memory: restarting ElasticMQ drops in-flight messages (dev only).
queues {
  streamforge-probe {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "streamforge-probe-dlq", maxReceiveCount = 3 }
  }
  streamforge-transcode {
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "streamforge-transcode-dlq", maxReceiveCount = 3 }
  }
  streamforge-thumbnail {
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "streamforge-thumbnail-dlq", maxReceiveCount = 3 }
  }
  streamforge-catalog-status {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue { name = "streamforge-catalog-status-dlq", maxReceiveCount = 3 }
  }
  streamforge-probe-dlq {}
  streamforge-transcode-dlq {}
  streamforge-thumbnail-dlq {}
  streamforge-catalog-status-dlq {}
}
