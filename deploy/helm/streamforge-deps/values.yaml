global:
  registry: registry.localhost:5111
  imageTag: "" # set by `make up` (git SHA)

# Secret values come from the gitignored deploy/helm/secrets.local.yaml (`make secrets`).
s3:
  accessKey: ""
  secretKey: ""
  publicHost: s3.streamforge.localhost

postgres:
  name: streamforge-pg
  image: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie # default for operator 1.30.1
  instances: 1
  storage: 2Gi
  resources:
    requests: { cpu: 100m, memory: 192Mi }
    limits: { memory: 512Mi }

redis:
  kind: StatefulSet
  image: { repository: redis, tag: 8.8.4-alpine3.23, external: true }
  runAsUser: 999 # the image's redis user
  port: 6379
  # Pub/sub + throttling only: no persistence needed.
  command: [redis-server, --save, "", --appendonly, "no", --maxmemory, 48mb]
  probes: { tcp: true }
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 96Mi }
  networkPolicy:
    from: [catalog-api, probe-worker, transcode-worker, thumbnail-worker, progress-svc]

seaweedfs:
  kind: StatefulSet
  image: { repository: chrislusf/seaweedfs, tag: "4.53", external: true }
  port: 8333
  command: [weed]
  args: [server, -dir=/data, -s3, -s3.port=8333, -s3.config=/etc/seaweedfs/s3.json,
         -master.volumeSizeLimitMB=512, -volume.max=0, -ip.bind=0.0.0.0]
  probes: { liveness: /status, readiness: /status, initialDelaySeconds: 10 }
  persistence: { size: 5Gi, mountPath: /data }
  emptyDirs: [{ name: tmp, mountPath: /tmp }]
  files: [{ name: s3-config, mountPath: /etc/seaweedfs, secret: streamforge-s3 }]
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
  networkPolicy:
    allowSelf: true # master, volume, filer and S3 gateway talk over the pod IP
    from: [ingress, catalog-api, probe-worker, transcode-worker, thumbnail-worker, terraform-local]
    ports: [8333]

elasticmq:
  image: { repository: softwaremill/elasticmq-native, tag: 1.7.1, external: true }
  port: 9324
  probes: { tcp: true }
  files: [{ name: config, mountPath: /opt/elasticmq.conf, subPath: elasticmq.conf, configMap: elasticmq }]
  emptyDirs: [{ name: tmp, mountPath: /tmp }]
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 192Mi }
  networkPolicy:
    from: [catalog-api, probe-worker, transcode-worker, thumbnail-worker, sns-shim]

snsShim:
  kind: StatefulSet
  image: { repository: streamforge/sns-shim }
  port: 9911
  env:
    AWS_REGION: us-east-1
    AWS_ENDPOINT_URL_SQS: http://elasticmq:9324
    STATE_FILE: /data/state.json
  secretEnv:
    - { name: AWS_ACCESS_KEY_ID, secret: streamforge-s3, key: accessKey }
    - { name: AWS_SECRET_ACCESS_KEY, secret: streamforge-s3, key: secretKey }
  probes: {}
  persistence: { size: 64Mi, mountPath: /data }
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { memory: 48Mi }
  networkPolicy:
    from: [catalog-api, probe-worker, transcode-worker, thumbnail-worker, terraform-local]
    to: [{ name: elasticmq, port: 9324 }]

terraform:
  image: { repository: streamforge/terraform-local }
