{{- $c := .Values.catalogApi }}
# Runs migrations (advisory-locked) and creates the demo user after install/upgrade.
{{ include "sf-lib.networkPolicy" (dict "ctx" $ "name" "catalog-api-seed" "np" (dict "to" (list (dict "cnpgCluster" "streamforge-pg" "port" 5432)))) }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-api-seed
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-api-seed
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: seed
          image: {{ include "sf-lib.image" (dict "ctx" $ "c" $c) }}
          args: [dist/seed.js]
          env:
            - { name: SEED_USER_EMAIL, value: {{ .Values.seedUser.email | quote }} }
            - name: SEED_USER_PASSWORD
              valueFrom: { secretKeyRef: { name: streamforge-app, key: seedPassword } }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: streamforge-pg-app, key: uri } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
