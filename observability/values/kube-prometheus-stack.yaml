# kube-prometheus-stack, trimmed for the laptop RAM budget (`make observability`).
fullnameOverride: kps
defaultRules: { create: false } # our own rules live in observability/chart

# k3s runs these inside the k3s binary; their endpoints are not scrapeable here.
kubeControllerManager: { enabled: false }
kubeScheduler: { enabled: false }
kubeEtcd: { enabled: false }
kubeProxy: { enabled: false }

prometheusOperator:
  resources: { requests: { cpu: 20m, memory: 48Mi }, limits: { memory: 192Mi } }

prometheus:
  prometheusSpec:
    retention: 2d
    scrapeInterval: 15s
    # pick up PodMonitors/PrometheusRules from any release, not just this one
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources: { requests: { cpu: 100m, memory: 384Mi }, limits: { memory: 1Gi } }

alertmanager:
  alertmanagerSpec:
    retention: 24h
    resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 96Mi } }

kube-state-metrics:
  resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }

prometheus-node-exporter:
  resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }

grafana:
  fullnameOverride: grafana
  # The ~25 bundled Kubernetes dashboards pushed Grafana into GC thrash at 512Mi (health
  # checks timed out); the laptop budget keeps only the StreamForge dashboards.
  defaultDashboardsEnabled: false
  env:
    # Grafana 13 (built-in API server + search index) needs ~400Mi to run; a GOMEMLIMIT at
    # that level made the GC run constantly and health checks time out.
    GOMEMLIMIT: 640MiB
  admin:
    existingSecret: grafana-admin # created by `make observability` (random password)
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts: [grafana.streamforge.localhost]
  grafana.ini:
    auth.anonymous: { enabled: true, org_role: Viewer } # demo links open without a login
    users: { default_theme: dark }
    dashboards: { default_home_dashboard_path: /tmp/dashboards/streamforge-pipeline.json }
  sidecar:
    dashboards: { enabled: true, label: grafana_dashboard, searchNamespace: ALL }
    datasources: { enabled: true }
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      url: http://loki.monitoring.svc.cluster.local:3100
      jsonData:
        derivedFields: # log line -> trace
          - name: trace_id
            matcherRegex: '"trace_id":"(\w+)"'
            url: "$${__value.raw}"
            datasourceUid: tempo
    - name: Tempo
      uid: tempo
      type: tempo
      url: http://tempo.monitoring.svc.cluster.local:3200
      jsonData:
        tracesToLogsV2: # span -> logs with the same trace id
          datasourceUid: loki
          spanStartTimeShift: -5m
          spanEndTimeShift: 5m
          customQuery: true
          query: '{k8s_namespace_name=~"streamforge.*"} |= "$${__span.traceId}"'
        nodeGraph: { enabled: true }
        search: { hide: false }
  # 256Mi was OOM-killed while loading the default Kubernetes dashboards
  resources: { requests: { cpu: 20m, memory: 384Mi }, limits: { memory: 768Mi } } # 256Mi: OOM; ~400Mi working set
