# Loki as a single binary with filesystem storage (no object store, no caches).
fullnameOverride: loki
deploymentMode: SingleBinary
loki:
  auth_enabled: false
  commonConfig: { replication_factor: 1 }
  storage: { type: filesystem }
  schemaConfig:
    configs:
      - from: "2026-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index: { prefix: index_, period: 24h }
  limits_config:
    retention_period: 48h
    allow_structured_metadata: true # OTLP attributes
  compactor: { retention_enabled: true, delete_request_store: filesystem }
  pattern_ingester: { enabled: false }
singleBinary:
  replicas: 1
  persistence: { enabled: true, size: 2Gi }
  resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
read: { replicas: 0 }
write: { replicas: 0 }
backend: { replicas: 0 }
gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
minio: { enabled: false }
