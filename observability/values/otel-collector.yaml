# OpenTelemetry Collector as a DaemonSet: tails our pods' logs into Loki and forwards
# traces from the services to Tempo. Pods send OTLP to the collector on their own node.
fullnameOverride: otel-collector
mode: daemonset
image:
  repository: otel/opentelemetry-collector-k8s
presets:
  logsCollection: { enabled: true, includeCollectorLogs: false }
  kubernetesAttributes: { enabled: true }
service:
  enabled: true
config:
  receivers:
    filelog:
      include: [/var/log/pods/streamforge*_*/*/*.log] # only StreamForge namespaces
  processors:
    memory_limiter: { check_interval: 5s, limit_percentage: 80, spike_limit_percentage: 25 }
    batch: { timeout: 2s }
  exporters:
    otlphttp/loki: { endpoint: http://loki.monitoring.svc.cluster.local:3100/otlp }
    otlphttp/tempo: { endpoint: http://tempo.monitoring.svc.cluster.local:4318 }
  service:
    pipelines:
      traces:
        receivers: [otlp]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp/tempo]
      logs:
        receivers: [filelog]
        processors: [memory_limiter, k8sattributes, batch]
        exporters: [otlphttp/loki]
      metrics: null # Prometheus scrapes the services directly
resources: { requests: { cpu: 20m, memory: 64Mi }, limits: { memory: 256Mi } }
